name: Protected web release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Match design-audit/package-lock.json. Includes both browsers and their
    # system libraries, avoiding slow per-run Ubuntu mirror downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      MORZSA_AUDIT_BROWSER_CHANNEL: chromium
      MORZSA_WEB_SANITY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            design-audit/package-lock.json
      - run: npm ci
      - run: npm --prefix design-audit ci
      - run: npm run build:web
      - run: node design-audit/verify-web-build.mjs
      - name: Record build and sanity result
        run: node -e "const fs=require('fs');const version=JSON.parse(fs.readFileSync('web-dist/version.json'));fs.writeFileSync('web-dist/version.json', JSON.stringify({...version,commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,verification:'build-sanity',sanity:'passed',audit:'not-run'})+'\n')"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web-dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-evidence-${{ github.run_id }}
          path: |
            design-audit/runs/web-build-*
          retention-days: 14
  deploy:
    name: Deploy verified web app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
  cloudfront:
    name: Deploy verified web app to CloudFront
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_FRONTEND_ROLE_ARN != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
      AWS_FRONTEND_DISTRIBUTION: ${{ vars.AWS_FRONTEND_DISTRIBUTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: verified-artifact
      - name: Extract the build-and-sanity artifact
        run: mkdir -p web-dist && tar -xf verified-artifact/artifact.tar -C web-dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          aws-region: eu-north-1
      - run: npm --prefix aws/frontend ci
      - name: Publish the verified revision and invalidate CloudFront
        run: node aws/frontend/deploy.mjs web-dist
