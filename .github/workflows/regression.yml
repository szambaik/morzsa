name: Full regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Full regression (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Match design-audit/package-lock.json. Includes both browsers and their
    # system libraries, avoiding slow per-run Ubuntu mirror downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      MORZSA_AUDIT_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            design-audit/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test*.py'
      - run: npm --prefix design-audit ci
      - run: npm --prefix design-audit test
      - name: Verify prepared browser runtime
        run: node design-audit/check-browser-runtime.mjs
      - run: node design-audit/check-release.mjs
      - run: node design-audit/mobile/check-mobile.mjs after chromium
      - run: node design-audit/mobile/check-mobile.mjs after webkit
      - run: node tests/check-compact-surfaces.mjs
      - run: node design-audit/performance/runner.mjs regression
      - run: node design-audit/plus-latency.mjs --check
      - run: npm run build:web
      - run: node design-audit/verify-web-build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-evidence-${{ github.run_id }}
          path: |
            design-audit/runs
            design-audit/performance/runs
          retention-days: 14
